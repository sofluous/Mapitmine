<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MapItMine Editor And Maps Layout QA</title>
    <link rel="stylesheet" href="../design-system/theme.css" />
    <link rel="stylesheet" href="../src/editor-fields.css" />
    <style>
      :root {
        --space-xs: 4px;
        --space-sm: 8px;
        --space-md: 12px;
        --font-sm: 12px;
        --font-md: 13px;
        --ui-border-quiet: var(--ds-border-subtle, rgba(255, 255, 255, 0.16));
      }

      body {
        margin: 0;
        padding: 24px;
        background: var(--ds-bg, #111);
        color: var(--color-text, #eef);
        font-family: var(--ds-font-body, system-ui, sans-serif);
      }

      main {
        display: grid;
        gap: 24px;
        max-width: 1040px;
      }

      h1,
      h2,
      p {
        margin-top: 0;
      }

      .fixture-grid {
        display: grid;
        grid-template-columns: minmax(0, 340px) minmax(0, 360px);
        gap: 24px;
        align-items: start;
      }

      .app-panel,
      .ds-card {
        background: var(--ds-card-bg, #181818);
        border: var(--ds-border-w, 1px) solid var(--ds-card-border, #76510d);
        border-radius: var(--ds-card-radius, 4px);
        box-shadow: var(--ds-card-shadow, none);
      }

      .control-section {
        padding: var(--space-md);
      }

      .control-section + .control-section {
        margin-top: var(--space-md);
      }

      .control-section-title {
        display: inline-flex;
        align-items: center;
        gap: var(--space-xs);
        color: var(--color-text-heading, #fff);
        font-size: var(--font-sm);
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .control-form,
      .pin-editor-fields,
      .map-data-group {
        display: grid;
        gap: var(--space-sm);
      }

      .pin-editor-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: var(--space-sm);
        padding: var(--space-sm) var(--space-md);
        border-bottom: 1px solid var(--ui-border-quiet);
      }

      .pin-editor-body {
        padding: var(--space-md);
      }

      .pin-editor-actions {
        display: flex;
        justify-content: flex-end;
        gap: var(--space-sm);
        padding: var(--space-sm) var(--space-md);
        border-top: 1px solid var(--ui-border-quiet);
      }

      .control-inline {
        display: grid;
        gap: var(--space-sm);
      }


      .ds-input,
      .ds-select {
        width: 100%;
        min-width: 0;
        box-sizing: border-box;
      }

      .pin-editor-coords .ds-input {
        inline-size: 100%;
        font-variant-numeric: tabular-nums;
      }

      textarea.ds-input {
        min-height: 84px;
        resize: vertical;
      }

      .map-data-copy {
        margin: 0;
        color: color-mix(in oklab, var(--color-text, #eef) 72%, transparent);
        font-size: var(--font-sm);
      }

      .map-data-title {
        color: var(--color-text-heading, #fff);
        font-size: var(--font-sm);
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .map-data-group + .map-data-group {
        padding-top: var(--space-xs);
        border-top: 1px solid var(--ui-border-quiet);
      }

      .map-action-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--space-xs);
      }

      .map-action-grid .ds-btn {
        justify-content: center;
        min-width: 0;
      }

      .ds-btn {
        min-height: 44px;
      }

      .map-gallery-card {
        display: grid;
        gap: var(--space-xs);
        padding: var(--space-sm);
        border: 1px solid var(--ui-border-quiet);
      }

      .map-gallery-card.item-card.is-active {
        background: color-mix(in oklab, var(--ds-card-bg, #181818) 86%, var(--ds-accent, #6cf) 14%);
      }

      .map-gallery-card-actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-xs);
      }

      @media (max-width: 520px) {
        .fixture-grid,

        .map-action-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body data-theme="paper-mint">
    <main>
      <header>
        <h1>Editor And Maps Layout QA</h1>
        <p>
          Check that coordinates are readable, the editor header has no subtitle
          or coordinate readout, and Maps uses compact gallery cards with
          shared overflow actions.
        </p>
      </header>

      <section class="fixture-grid">
        <article id="pinEditorPanel" class="app-panel compact-editor" aria-label="Pin editor fixture">
          <div class="pin-editor-header">
            <div class="control-section-title">New pin</div>
            <button class="ds-btn" type="button">X</button>
          </div>
          <div class="pin-editor-body">
            <div class="editor-coordinates pin-editor-coords">
              <label class="editor-field" for="fixtureX"><span class="editor-field-label">X</span><input id="fixtureX" class="ds-input" value="-123456789" /></label>
              <label class="editor-field" for="fixtureY"><span class="editor-field-label">Y</span><input id="fixtureY" class="ds-input" value="72" /></label>
              <label class="editor-field" for="fixtureZ"><span class="editor-field-label">Z</span><input id="fixtureZ" class="ds-input" value="-987654321" /></label>
            </div>
            <label class="editor-field" for="fixtureName"><span class="editor-field-label">Name</span><input id="fixtureName" class="ds-input" value="Village" /></label>
            <div class="editor-property-pair">
              <label class="editor-field" for="fixtureLayer"><span class="editor-field-label">Layer</span><select id="fixtureLayer" class="ds-select"><option>Base</option></select></label>
              <label class="editor-field" for="fixtureType"><span class="editor-field-label">Type</span><select id="fixtureType" class="ds-select"><option>Village</option></select></label>
            </div>
            <div class="editor-secondary">
              <details class="editor-disclosure"><summary>Notes</summary><label class="editor-field" for="fixtureNotes"><span class="editor-field-label">Notes</span><textarea id="fixtureNotes" class="ds-input">Notes</textarea></label></details>
              <details class="editor-disclosure"><summary>Appearance</summary><div class="editor-appearance">
                <label class="editor-field editor-swatch" for="fixtureColor"><span class="editor-field-label">Color</span><input id="fixtureColor" type="color" value="#ffcc00" /></label>
                <label class="editor-field editor-icon" for="fixtureIcon"><span class="editor-field-label">Icon</span><select id="fixtureIcon" class="ds-select"><option>Icon</option></select></label>
              </div></details>
            </div>
          </div>
          <div class="pin-editor-actions editor-footer">
            <button class="ds-btn" type="button">Cancel</button>
            <button class="ds-btn ds-btn-primary" type="button">Save</button>
          </div>
        </article>

        <article class="control-section" aria-label="Maps actions fixture">
          <div class="control-form">
            <div class="map-action-grid">
              <button class="ds-btn" type="button">New</button>
              <button class="ds-btn" type="button">Import</button>
              <button class="ds-btn" type="button">Open</button>
            </div>
            <div class="map-gallery-card item-card is-active" aria-current="true">
              <span class="map-gallery-card-actions">
                <button class="ds-btn" type="button">More</button>
              </span>
              <span>Village Route</span>
              <span>
                <span>Linked</span>
                <span>Active</span>
              </span>
              <span>12 pins - Linked file - Updated now</span>
            </div>
          </div>
        </article>
      </section>
    </main>
    <script>
      document.querySelectorAll('.editor-coordinates input').forEach(input => {
        const style = getComputedStyle(input), ctx = document.createElement('canvas').getContext('2d');
        ctx.font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
        if (style.letterSpacing !== "normal") ctx.letterSpacing = style.letterSpacing;
        input.closest('label').style.setProperty('--coordinate-min', `${Math.ceil(ctx.measureText(input.value).width + parseFloat(style.paddingLeft) + parseFloat(style.paddingRight) + 4)}px`);
        input.closest('label').style.setProperty('--coordinate-weight', input.value.length);
      });
    </script>
  </body>
</html>
